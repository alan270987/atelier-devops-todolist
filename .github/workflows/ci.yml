name: CI - Vérifications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3
        
      - name: Test simple
        run: echo "🎉 Le workflow fonctionne avec succès !"
        
      - name: Vérification supplémentaire
        run: |
          echo "La date actuelle est : $(date)"
          echo "Le dossier contient :"
          ls -la
